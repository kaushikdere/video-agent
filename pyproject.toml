[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "video-agent"
version = "1.0.0"
description = "One prompt → a continuous 40-second story: four 10-second shots with enforced narrative and visual continuity."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Kaushik Dere" }]
license = { text = "MIT" }
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",

    # LangGraph orchestration
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",

    # LLM gateway
    "litellm>=1.50.0",

    # Observability
    "langfuse>=2.30.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.13.0",
    "pgvector>=0.3.0",

    # Cache / state
    "redis[hiredis]>=5.0.0",

    # Config & validation
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.0",

    # HTTP client (provider calls)
    "httpx>=0.27.0",
    "tenacity>=9.0.0",

    # Storage
    "boto3>=1.35.0",
    "botocore>=1.35.0",

    # Utils
    "structlog>=24.4.0",
    "rich>=13.8.0",
    "typer>=0.12.0",
    "anyio>=4.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.30.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "faker>=30.0.0",
    "ruff>=0.7.0",
    "mypy>=1.11.0",
]

[project.scripts]
video-agent = "video_agent.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/video_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
